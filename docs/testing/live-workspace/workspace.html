<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic native workspace host</title>
<link rel="stylesheet" href="./host.css">
<link rel="stylesheet" href="./plugin.css">
<header id="fixture-header">
  <strong>Mock Obsidian</strong>
  <button type="button" id="talk">Talk to Vault</button>
  <output id="counts" aria-label="Mock session counters"></output>
  <output id="result" aria-label="Mock result status" aria-live="polite">No query sent.</output>
</header>
<main class="workspace" aria-label="Synthetic native workspace"><div class="workspace-split mod-root"></div></main>
<footer class="mobile-navbar" aria-label="Mock native navigation">Mock mobile navigation</footer>
<div id="fixture-keyboard" aria-hidden="true" hidden>Simulated keyboard occupies this space. No real keyboard or microphone is used.</div>
<script src="./app.js"></script>
